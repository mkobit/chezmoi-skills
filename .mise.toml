[tools]
bun = "1.4.2"

[settings]
locked = true
http_retries = 5

[tasks."sbx:validate"]
description = "Validate sbx kit"
run = "sbx kit validate .sbx/kit"

[tasks."sbx:plan"]
description = "Plan sbx environments"
run = "sbx env plan .sbx/sbxenv.yaml && sbx env plan .sbx/sbxenv.agy.yaml && sbx env plan .sbx/sbxenv.claude.yaml"

[tasks.validate]
description = "Validate skills schema and Claude plugin configurations"
run = "bun run scripts/validate/index.ts --claude-plugin-dir=.claude-plugin"

[tasks."test:contracts"]
description = "Run Tier 2 deterministic mock contract tests"
run = "bun run scripts/test-contracts.ts"

[tasks.test]
description = "Run unit tests"
run = "bun test"
depends = ["test:contracts"]

[tasks."lint:md"]
description = "Lint markdown files"
run = "bun run markdownlint-cli2"

[tasks."lint:spelling"]
description = "Lint spelling across markdown files"
run = "bun run --bun node_modules/cspell/bin.mjs \"**/*.md\""

[tasks."lint:eslint"]
description = "Lint JavaScript, TypeScript, and JSON files with ESLint"
run = "bun run eslint ."

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:spelling", "lint:eslint"]
