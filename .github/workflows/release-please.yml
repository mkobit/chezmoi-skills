name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Manage release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          # PAT so CI and PR-title checks run on the release PR
          # (workflows are not triggered by the default GITHUB_TOKEN).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: open-release-pr
        name: Check for open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          has_pr=$(gh pr list --repo "${{ github.repository }}" --state open --head "release-please--branches--main" --json number --jq 'length > 0')
          echo "exists=${has_pr}" >> "$GITHUB_OUTPUT"

      - name: Checkout release PR branch
        if: ${{ steps.open-release-pr.outputs.exists == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: release-please--branches--main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        if: ${{ steps.open-release-pr.outputs.exists == 'true' }}
        uses: $/.github/actions/setup-bun

      - name: Format release PR files
        if: ${{ steps.open-release-pr.outputs.exists == 'true' }}
        run: |
          bun run fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: format release PR files"
            git push
          fi
