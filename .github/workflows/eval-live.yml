name: Live LLM Benchmark Evaluation

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  eval-live:
    name: Run Promptfoo Live Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-bun

      - name: Run Promptfoo Live Evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          CI: "true"
        run: bun run eval

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Record benchmark metrics
        run: |
          mkdir -p gh-pages
          bun run record:benchmark --target-dir gh-pages --commit-sha ${{ github.sha }}

      - name: Generate benchmark history index
        run: |
          bun run generate:history --target-dir gh-pages

      - name: Publish benchmark history to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -d .git ]; then
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git add .
          git commit -m "chore: record benchmark history for ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin gh-pages

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-results
          path: eval_results/results.json
          if-no-files-found: ignore
