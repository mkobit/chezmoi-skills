name: Live LLM benchmark evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: Approve the full provider request matrix after reviewing the plan job
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: live-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan live benchmark
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-bun

      - name: Validate Promptfoo configurations
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          CI: "true"
        run: bun run eval:validate

      - name: Prepare reproducible request plan
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun run scripts/prepare-live-benchmark.ts

      - name: Upload benchmark plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-plan
          path: |
            eval_results/live-preflight.json
            eval_results/promptfoo-answer-tests.generated.yaml
            eval_results/promptfoo-router-tests.generated.yaml
            eval_results/promptfooconfig.router.generated.yaml
          if-no-files-found: error
          retention-days: 14

  eval-live:
    name: Run approved Promptfoo live benchmark
    needs: plan
    if: inputs.confirm_paid_run == true
    environment: live-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-bun

      - name: Download approved benchmark plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promptfoo-plan
          path: eval_results

      - name: Verify configured provider credentials
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_API_KEY}"
          test -n "${ANTHROPIC_API_KEY}"

      - name: Run both live benchmark suites
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          CI: "true"
        run: |
          set +e
          bun run eval:answers
          answer_status=$?
          bun run eval:router
          router_status=$?
          if (( answer_status != 0 || router_status != 0 )); then
            exit 1
          fi

      - name: Upload private benchmark review artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-results
          path: |
            eval_results/live-preflight.json
            eval_results/promptfoo-answer-tests.generated.yaml
            eval_results/promptfoo-router-tests.generated.yaml
            eval_results/promptfooconfig.router.generated.yaml
            eval_results/results.json
            eval_results/index.html
            eval_results/router-results.json
            eval_results/router-index.html
          if-no-files-found: warn
          retention-days: 14
