name: Live LLM Benchmark Evaluation

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  eval-live:
    name: Run Promptfoo Live Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-bun

      - name: Run Promptfoo Live Evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          CI: "true"
        run: bun run eval

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-results
          path: eval_results/results.json
          if-no-files-found: ignore
