name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6.1.2
        with:
          validateSingleCommit: true
          types: |
            feat
            fix
            docs
            deps
            perf
            chore
            ci
            build
            test
            refactor
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
