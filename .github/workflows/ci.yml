name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-bun

      - name: Lint markdown
        run: bun run lint:md

      - name: Lint spelling
        run: bun run lint:spelling

      - name: Check formatting
        run: bun run fmt:check

      - name: Validate skills and claude configs
        run: bun run validate

      - name: Run Tier 2 deterministic mock contract tests
        run: bun run test:contracts

      - name: Run unit tests
        run: bun run test

      - name: Validate Promptfoo configurations
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          CI: "true"
        run: bun run eval:validate

  verify-lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify actions lockfile
        run: gh actions-lock --verify
