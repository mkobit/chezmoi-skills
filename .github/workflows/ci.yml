name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-bun

      - name: Lint markdown
        run: bun run lint:md

      - name: Lint spelling
        run: bun run lint:spelling

      - name: Lint JSON and YAML
        run: bun run lint:eslint

      - name: Validate skills and claude configs
        run: bun run validate

      - name: Run Tier 2 deterministic mock contract tests
        run: bun run test:contracts

      - name: Run unit tests
        run: bun run test

