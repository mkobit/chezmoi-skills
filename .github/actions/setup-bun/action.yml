description: "Sets up Bun environment from mise.toml and installs dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup mise and Bun
      uses: jdx/mise-action@v5.2.9
      with:
        install: true
        github_token: ${{ github.token }}

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
