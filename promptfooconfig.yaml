# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Generate checked-in corpus inputs first: bun run scripts/generate-promptfoo-evals.ts
# Structural validation without provider calls: bun run eval:validate
# Credentialed answer smoke test: bun run eval:generate && bun run eval:answers -- --filter-first-n 1 --no-cache
# Credentialed router smoke test: promptfoo eval --config eval_results/promptfooconfig.router.generated.yaml --filter-first-n 1 --no-cache
description: Chezmoi agent-skill answer evaluation derived from tests/evals/*.json

outputPath: eval_results/results.json

prompts:
  - label: baseline (no skill)
    raw: "System: You are an AI assistant helping with chezmoi dotfile management.\nUser: {{user_prompt}}"
  - label: skill catalog (routing context)
    raw: "System: You are an AI assistant helping with chezmoi dotfile management.\nUse the catalog to select the relevant skill silently before answering.\nAvailable skills:\n- chezmoi-cli-commands: Manage chezmoi CLI commands, flags, diff, and status inspection\n- chezmoi-configuration: Manage chezmoi configuration options and hook directives\n- chezmoi-externals: Manage external dependencies and git-repo external sources\n- chezmoi-file-attributes: Manage target file attributes and source file naming prefixes\n- chezmoi-init: Initialize and clone chezmoi dotfile repositories\n- chezmoi-machine-config: Manage per-machine configuration, OS conditionals, and chezmoidata\n- chezmoi-scripts: Manage lifecycle execution scripts and script state buckets\n- chezmoi-secrets-management: Manage secrets, age/gpg encryption, and keyrings\n- chezmoi-templating: Manage Go template syntax and Sprig functions\nUser: {{user_prompt}}"
  - label: selected skill and reference (knowledge context)
    raw: "System: You are an AI assistant helping with chezmoi dotfile management.\nThe agent has selected this skill entry point:\n{{skill_context}}\nThe agent has read this relevant progressive-disclosure reference:\n{{reference_context}}\nAnswer only from this context when possible.\nUser: {{user_prompt}}"

providers:
  - id: google:gemini-3.8-flash
    config:
      temperature: 0
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0

tests: file://eval_results/promptfoo-answer-tests.generated.yaml
