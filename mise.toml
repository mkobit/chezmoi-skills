[tools]
bun = "1.4.4"
"github:gastownhall/beads" = "1.3.2"

[settings]
locked = true
http_retries = 5

[tasks."sbx:validate"]
description = "Validate sbx kit"
run = "sbx kit validate .sbx/kit"

[tasks."sbx:plan"]
description = "Plan sbx environments"
run = "sbx env plan .sbx/sbxenv.yaml && sbx env plan .sbx/sbxenv.agy.yaml && sbx env plan .sbx/sbxenv.claude.yaml"

[tasks.validate]
description = "Validate skills schema and Claude plugin configurations"
run = "bun run scripts/skills/validate/index.ts --claude-plugin-dir=.claude-plugin"

[tasks."validate:evals"]
description = "Validate eval corpus JSON files against the schema (offline)"
run = "bun run scripts/evals/cli.ts validate"

[tasks."validate:contracts"]
description = "Run static corpus-to-skill contract checks (offline)"
run = "bun run scripts/evals/test-contracts.ts"

[tasks.test]
description = "Run unit tests"
run = "bun test"
depends = ["validate:contracts"]

[tasks."eval:live"]
description = "Run live model-calling evals via codex or agy"
run = "bun run scripts/evals/cli.ts run"

[tasks."eval:live:judge"]
description = "Run post-hoc LLM-as-a-judge rubric grading"
run = "bun run scripts/evals/cli.ts judge"

[tasks."eval:live:simulate"]
description = "Run multi-turn simulated user evaluations"
run = "bun run scripts/evals/cli.ts simulate"

[tasks."eval:live:generate"]
description = "Generate synthetic edge-case eval candidates"
run = "bun run scripts/evals/cli.ts generate"

[tasks."lint:md"]
description = "Lint markdown files"
run = "bun run markdownlint-cli2"

[tasks."lint:spelling"]
description = "Lint spelling across markdown files"
run = "bun run --bun node_modules/cspell/bin.mjs \"**/*.md\""

[tasks.fmt]
description = "Format files with bun fmt"
run = "bun fmt"

[tasks."fmt:check"]
description = "Check file formatting with bun fmt"
run = "bun fmt --check"

[tasks.typecheck]
description = "Typecheck TypeScript files with bun check"
run = "bun check"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:spelling", "fmt:check"]
